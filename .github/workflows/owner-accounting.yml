name: Owner full accounting index capture
on:
  workflow_dispatch:
    inputs:
      through_block:
        description: 'Exact owner-approved final block; contiguous from latest durable candidate, <=100000 blocks per run. Does not enable LP replay.'
        required: true
        type: string
      rpc_budget:
        description: 'Explicit approved total attempts including failures. Shares global 100/day cap. No retries on rate/quota errors.'
        required: true
        type: choice
        options: ['20', '40', '60']
concurrency:
  group: metric-owner-reconstruction
  cancel-in-progress: false
permissions: {}
jobs:
  capture:
    if: github.actor == 'projectuwb' && github.repository == 'projectuwb/metric-lp-detective' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:web
      - name: Bounded full-event accounting candidate; no replay promotion
        env:
          BNB_RPC_URL: ${{ secrets.BNB_RPC_URL }}
          LP_RPC_URL: ${{ secrets.LP_RPC_URL }}
          GH_TOKEN: ${{ github.token }}
          INDEX_RPC_BUDGET: ${{ inputs.rpc_budget }}
          ACCOUNTING_TARGET: ${{ inputs.through_block }}
        run: node --import tsx scripts/remote-accounting.ts
